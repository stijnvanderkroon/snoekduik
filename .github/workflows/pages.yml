name: Publiceer op GitHub Pages

on:
  push:
    branches: [main]
  # Ook op pull requests, zodat de tests draaien voordat er iets naar main kan.
  # Alleen de bouwstap; publiceren gebeurt uitsluitend vanaf main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén publicatie tegelijk; een nieuwe push mag een lopende niet afbreken.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Soortgegevens opnieuw genereren
        # data/soorten.json staat in de repo, maar wordt hier opnieuw gebouwd
        # zodat een vergeten herbouw na een tekstwijziging niet live komt.
        run: node scripts/bouw-soorten.mjs

      - name: Logicatests
        run: node tools/test/logica.mjs

      - name: Schermtests
        run: |
          npm install --no-save --silent jsdom
          node tools/test/schermen.mjs

      - name: Site samenstellen
        # Alleen wat de site nodig heeft. scripts/ en tools/ zijn ontwikkelhulp
        # en horen niet gepubliceerd te worden.
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r app logos _site/
          mkdir -p _site/data
          cp data/soorten.json _site/data/
          # Voorkomt dat GitHub Pages de bestanden door Jekyll haalt.
          touch _site/.nojekyll

      - name: Controleer dat er geen ontwikkelbestanden meegaan
        run: |
          for pad in tools scripts CLAUDE.md brief.md ontwerp.md soorten.seed.json \
                     data/fotoProbe.json data/fotoOordelen.json; do
            if [ -e "_site/$pad" ]; then
              echo "FOUT: $pad zit in de publicatie"; exit 1
            fi
          done
          test -f _site/index.html
          test -f _site/data/soorten.json
          echo "Publicatie bevat $(find _site -type f | wc -l) bestanden"

      - name: Artefact klaarzetten
        # Alleen nodig als er ook echt gepubliceerd wordt.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publiceren:
    needs: bouwen
    # Nooit publiceren vanaf een pull request, ook niet vanaf een fork.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
